[package]
name = "rustilleus"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A production-oriented price-time-priority limit order matching service"
repository = "https://github.com/paszti96/rustilleus"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
serde_json = "1.0.149"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
